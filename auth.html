<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaYield - Login & Register</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0b0b; color: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 15px; }
        .auth-container { width: 100%; max-width: 400px; background: #141414; border: 1px solid #d4af37; border-radius: 16px; padding: 25px; box-shadow: 0 8px 32px rgba(212, 175, 55, 0.15); }
        .logo { text-align: center; font-size: 22px; font-weight: bold; color: #ffd700; margin-bottom: 20px; letter-spacing: 1px; }
        .form-toggle { display: flex; margin-bottom: 20px; border-bottom: 1px solid #333; }
        .toggle-btn { flex: 1; background: none; border: none; color: #aaa; padding: 10px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .toggle-btn.active { color: #ffd700; border-bottom: 2px solid #ffd700; }
        .form-box { display: none; }
        .form-box.active { display: block; }
        .form-control { width: 100%; padding: 12px; margin-bottom: 15px; background: #111; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 14px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: linear-gradient(135deg, #ffd700 0%, #d4af37 100%); color: #000; font-size: 15px; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo">⚡ ALPHAYIELD</div>
        
        <!-- Toggle Buttons -->
        <div class="form-toggle">
            <button class="toggle-btn active" onclick="switchForm('login')">Login</button>
            <button class="toggle-btn" onclick="switchForm('register')">Register</button>
        </div>

        <!-- LOGIN FORM -->
        <div id="loginForm" class="form-box active">
            <input type="text" id="loginMobile" class="form-control" placeholder="Enter Mobile Number">
            <input type="password" id="loginPassword" class="form-control" placeholder="Enter Password">
            <button class="btn" onclick="handleLogin()">Login to Account</button>
        </div>

        <!-- REGISTER FORM -->
        <div id="registerForm" class="form-box">
            <input type="text" id="regName" class="form-control" placeholder="Full Name">
            <input type="text" id="regMobile" class="form-control" placeholder="Mobile Number">
            <input type="password" id="regPassword" class="form-control" placeholder="Create Password">
            <input type="text" id="regRefCode" class="form-control" placeholder="Referral Code (Optional)">
            <button class="btn" onclick="handleRegister()">Register Now</button>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function switchForm(formType) {
            document.querySelectorAll('.form-box').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.toggle-btn').forEach(el => el.classList.remove('active'));
            
            if(formType === 'login') {
                document.getElementById('loginForm').classList.add('active');
                event.target.classList.add('active');
            } else {
                document.getElementById('registerForm').classList.add('active');
                event.target.classList.add('active');
            }
        }

        // Auto-detect referral code from URL URL (e.g. auth.html?ref=ABC123XYZ)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const ref = urlParams.get('ref');
            if(ref) {
                document.getElementById('regRefCode').value = ref;
                switchForm('register');
                document.querySelectorAll('.toggle-btn')[1].classList.add('active');
                document.querySelectorAll('.toggle-btn')[0].classList.remove('active');
            }
        }

        async function handleRegister() {
            const name = document.getElementById('regName').value;
            const mobile = document.getElementById('regMobile').value;
            const password = document.getElementById('regPassword').value;
            const invitedBy = document.getElementById('regRefCode').value || null;

            if(!name || !mobile || !password) {
                alert('Please fill all required fields!');
                return;
            }

            // Generate unique referral code (e.g. ALPHA + random 4 digits)
            const referralCode = 'ALPHA' + Math.floor(1000 + Math.random() * 9000);

            const { error } = await supabaseClient.from('users').insert([{
                name: name,
                mobile: mobile,
                password: password,
                referral_code: referralCode,
                invited_by: invitedBy,
                balance: 0.00
            }]);

            if(error) {
                alert('Registration failed: ' + error.message);
            } else {
                alert('Registration successful! Please login.');
                switchForm('login');
            }
        }

        async function handleLogin() {
            const mobile = document.getElementById('loginMobile').value;
            const password = document.getElementById('loginPassword').value;

            if(!mobile || !password) {
                alert('Please enter mobile and password!');
                return;
            }

            const { data, error } = await supabaseClient
                .from('users')
                .select('*')
                .eq('mobile', mobile)
                .eq('password', password)
                .single();

            if(error || !data) {
                alert('Invalid mobile number or password!');
            } else {
                // Save mobile in localStorage to use in dashboard
                localStorage.setItem('user_mobile', data.mobile);
                alert('Login successful!');
                window.location.href = 'index.html'; // Redirect to dashboard
            }
        }
    </script>
</body>
</html>
