<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Dashboard - INR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0b0b; color: #f5f5f5; padding: 15px; }
        .container { max-width: 480px; margin: 0 auto; background: #141414; border: 1px solid #d4af37; border-radius: 16px; padding: 20px; box-shadow: 0 8px 32px rgba(212, 175, 55, 0.15); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 15px; margin-bottom: 20px; }
        .logo { font-size: 18px; font-weight: bold; color: #d4af37; letter-spacing: 1px; }
        .balance-card { background: linear-gradient(135deg, #1f1a05 0%, #111 100%); border: 1px solid #d4af37; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .balance-title { font-size: 13px; color: #aaa; margin-bottom: 5px; }
        .balance-amount { font-size: 30px; font-weight: bold; color: #ffd700; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; font-size: 14px; }
        .btn-deposit { background: linear-gradient(135deg, #ffd700 0%, #d4af37 100%); color: #000; }
        .btn-withdraw { background: transparent; border: 1px solid #d4af37; color: #ffd700; }
        .engine-card { background: #1a1a1a; border-left: 4px solid #ffd700; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .engine-title { font-size: 15px; color: #ffd700; font-weight: bold; margin-bottom: 8px; }
        .engine-info { font-size: 13px; color: #ccc; display: flex; justify-content: space-between; margin-top: 5px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1a1a1a; border: 1px solid #d4af37; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; }
        .modal-content h3 { color: #ffd700; margin-bottom: 15px; font-size: 16px; }
        .form-control { width: 100%; padding: 10px; margin-bottom: 12px; background: #111; border: 1px solid #444; color: #fff; border-radius: 6px; }
        .close-btn { background: #444; color: #fff; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">⚡ APP DASHBOARD</div>
            <div id="user-mobile" style="font-size: 13px; color: #aaa;">Loading...</div>
        </div>

        <div class="balance-card">
            <div class="balance-title">Total Balance (INR)</div>
            <div class="balance-amount" id="user-balance">₹ 0.00</div>
        </div>

        <div class="btn-group">
            <button class="btn btn-deposit" onclick="openModal('depositModal')">Deposit ₹</button>
            <button class="btn btn-withdraw" onclick="openModal('withdrawModal')">Withdraw ₹</button>
        </div>

        <!-- Plan Activation Section -->
        <div class="engine-card">
            <div class="engine-title">🚀 Invest in 200-Hour Engine</div>
            <p style="font-size: 12px; color: #aaa; margin-bottom: 10px;">Get 0.50% hourly return (Total 100% in 200 hours).</p>
            <select id="selectedPlan" class="form-control" style="margin-bottom: 10px;">
                <option value="500">₹500 Plan</option>
                <option value="1000">₹1,000 Plan</option>
                <option value="5000">₹5,000 Plan</option>
            </select>
            <button class="btn btn-deposit" style="width: 100%;" onclick="buyPlan()">Activate Plan Now</button>
        </div>
    </div>

    <!-- Deposit Modal -->
    <div id="depositModal" class="modal">
        <div class="modal-content">
            <h3>Deposit Funds (INR)</h3>
            <input type="number" id="depAmount" class="form-control" placeholder="Enter Amount">
            <input type="text" id="depUtr" class="form-control" placeholder="Enter 12-digit UTR Number">
            <button class="btn btn-deposit" style="width: 100%;" onclick="submitDeposit()">Submit Deposit</button>
            <button class="btn close-btn" style="width: 100%;" onclick="closeModal('depositModal')">Cancel</button>
        </div>
    </div>

    <!-- Withdraw Modal -->
    <div id="withdrawModal" class="modal">
        <div class="modal-content">
            <h3>Withdraw Funds (INR)</h3>
            <input type="number" id="withAmount" class="form-control" placeholder="Enter Amount">
            <button class="btn btn-deposit" style="width: 100%;" onclick="submitWithdraw()">Request Withdrawal</button>
            <button class="btn close-btn" style="width: 100%;" onclick="closeModal('withdrawModal')">Cancel</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loggedInMobile = localStorage.getItem('user_mobile') || '8937985224';
        let currentUserId = null;

        async function fetchUserData() {
            const { data, error } = await supabaseClient.from('users').select('*').eq('mobile', loggedInMobile).single();
            if (data) {
                currentUserId = data.id;
                document.getElementById('user-balance').innerText = `₹ ${parseFloat(data.balance).toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
                document.getElementById('user-mobile').innerText = `+91 ${data.mobile}`;
            }
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        async function submitDeposit() {
            const amount = document.getElementById('depAmount').value;
            const utr = document.getElementById('depUtr').value;
            if(!amount || !utr) return alert('Fill all fields');

            const { error } = await supabaseClient.from('transactions').insert([{ user_id: currentUserId, type: 'deposit', amount: parseFloat(amount), utr_number: utr, status: 'pending' }]);
            if(error) alert(error.message);
            else { alert('Deposit submitted successfully!'); closeModal('depositModal'); }
        }

        async function submitWithdraw() {
            const amount = document.getElementById('withAmount').value;
            if(!amount) return alert('Enter amount');

            const { error } = await supabaseClient.from('transactions').insert([{ user_id: currentUserId, type: 'withdrawal', amount: parseFloat(amount), status: 'pending' }]);
            if(error) alert(error.message);
            else { alert('Withdrawal requested!'); closeModal('withdrawModal'); }
        }

        async function buyPlan() {
            const price = parseFloat(document.getElementById('selectedPlan').value);
            const { data: user } = await supabaseClient.from('users').select('balance').eq('id', currentUserId).single();
            
            if(user.balance < price) return alert('Insufficient balance!');

            await supabaseClient.from('users').update({ balance: user.balance - price }).eq('id', currentUserId);
            const expires = new Date(new Date().getTime() + (200 * 3600 * 1000)).toISOString();
            
            await supabaseClient.from('user_investments').insert([{ user_id: currentUserId, invested_amount: price, expires_at: expires }]);
            alert('Plan Activated Successfully!');
            location.reload();
        }

        window.onload = fetchUserData;
    </script>
</body>
    </html>
